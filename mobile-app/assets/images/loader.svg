<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Loading">
<title>Loading</title>
<style>
.sq{transform-box:fill-box;transform-origin:center;animation:breathe 2s ease-in-out infinite}
.v{stroke-dasharray:.62 .38;animation:trace 1.6s linear infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
.sq{animation:none}
.v{animation:none;stroke-dasharray:none}
}</style>
<rect class="sq" x="10" y="10" width="140" height="140" rx="34" fill="#FF6B1A"/>
<path class="v" pathLength="1" d="M42 54 L80 122 L118 54" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
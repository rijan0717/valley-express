name: valley_express_mobile
description: "Valley Express - On-Demand Drinks, Snacks & Liquor Delivery App for Kathmandu Valley"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  provider: ^6.1.2
  socket_io_client: ^3.0.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.3.3
  flutter_animate: ^4.5.0
  geolocator: ^13.0.2
  flutter_svg: ^2.0.10+1
  custom_refresh_indicator: ^4.0.1
  maplibre_gl: ^0.28.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Android/iOS launcher icon generation from the brand mark
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FF6B1A"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 21
